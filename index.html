<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8" />
  <title>Akmeņu karte - Interaktīva pasaules akmeņu un pieminekļu karte</title>
  <meta name="description" content="Interaktīva karte ar akmeņiem un pieminekļiem no visas pasaules. Meklē, filtrē un izpēti unikālus objektus ar fotogrāfijām, aprakstiem un atrašanās vietām." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

  <link rel="stylesheet" href="css/styles.css?v=12" />
</head>
<body>

<div id="loader" class="loader-overlay">
  <div class="loader-content">
    <div class="spinner"></div>
    <div class="loader-text">Ielādējas...</div>
  </div>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title-row">
        <h1 class="sidebar-title">
          <span id="total-count" class="count-badge">0</span>
          Akmeņu karte
        </h1>

        <button id="openFilters" class="filters-open-btn" type="button" aria-haspopup="dialog" aria-controls="filtersModal">
          Filtri
        </button>
      </div>

      <label class="search-row">
        <span class="sr-only">Meklēt</span>
        <input id="filter-search" type="text" placeholder="Meklēt (nosaukums, autors, valsts)..." />
      </label>
    </div>

    <div id="list-title">Objekti</div>
    <div id="objects-list"></div>
    <div id="sidebar-version">v<span id="version-number">...</span></div>
  </aside>

  <div id="map"></div>
</div>

<div id="filtersModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div id="filtersBackdrop" class="modal-backdrop"></div>

  <div class="modal-sheet" role="document">
    <div class="modal-top">
      <div class="modal-title">Filtri</div>
      <button id="closeFilters" class="modal-close-btn" type="button" aria-label="Aizvērt filtrus">✕</button>
    </div>

    <div class="modal-body">
      <label>
        Autors
        <select id="filter-author">
          <option value="">Visi</option>
        </select>
      </label>

      <label>
        Gads
        <select id="filter-year">
          <option value="">Visi</option>
        </select>
      </label>

      <label>
        Kontinents
        <select id="filter-continent">
          <option value="">Visi</option>
        </select>
      </label>

      <label>
        Valsts
        <select id="filter-country">
          <option value="">Visas</option>
        </select>
      </label>
    </div>

    <div class="modal-actions">
      <button id="resetFilters" class="btn-secondary" type="button">Notīrīt</button>
      <button id="applyFiltersBtn" class="btn-primary" type="button">Pielietot</button>
    </div>
  </div>
</div>

<footer id="footer">
  <a href="https://forms.gle/JcUwCwtvCwwk2Yxr7" target="_blank" rel="noopener noreferrer">➕ Forma</a>
</footer>

<script src="config.php?v=17"></script>
<script src="js/app.js?v=17"></script>
</body>
</html>
